name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布为 Release 的 tag（如 v0.0.10）；留空则只构建测试包'
        required: false
        default: ''
  push:
    branches: [main, master]
    # 正式发版看 tag：作者用 GitHub Desktop 只推分支不会带上 tag，
    # 补推 vA.B.C 才会走到下面创建 Release 的分支。
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不再用 android-actions/setup-android：v3/v4 都会在「镜像预装的 cmdline-tools 版本不等于
      # 它写死的版本」时去下载一个固定构建号的 commandline-tools 包，Google 清掉旧包后该下载一律
      # 404 —— 本仓库 run 35511048498（#30）与 35511489847（#31）都断在 Setup Android SDK，
      # 十几秒就失败，连 npm ci 都没跑到；上游 issue android-actions/setup-android#536 是同一个坑。
      # 改为直接用 runner 镜像自带的 SDK 与 sdkmanager：只做定位与许可确认，
      # 缺的平台 / 构建工具按 sdkmanager 的当前仓库清单补装，不再有写死的下载地址。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKM" ]; then echo "runner 镜像里找不到 sdkmanager，镜像可能又变了" >&2; exit 1; fi
          echo "sdkmanager: $SDKM"
          "$SDKM" --version
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          INST="$("$SDKM" --list_installed 2>/dev/null || true)"
          for pkg in "platform-tools" \
                     "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0" \
                     "platforms;android-36" "platforms;android-35" "platforms;android-34"; do
            echo "$INST" | grep -q -- "$pkg" || { echo "补装 $pkg"; "$SDKM" "$pkg" >/dev/null; }
          done
          "$SDKM" --list_installed 2>/dev/null | sed -n '1,40p' || true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Expo CLI
        run: npx expo --version

      # expo prebuild 会按 app.json 生成 android/app/build.gradle；不在前面注入的话
      # versionCode 永远是 1，Android 视所有构建为同一版本（详见 scripts/ci-version.js）
      - name: Inject build number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/ci-version.js "${{ github.run_number }}" --official
          else
            node scripts/ci-version.js "${{ github.run_number }}"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"

      - name: Verify APK exists
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK 存在: $(ls -lh android/app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "::error::APK 未生成，构建失败"
            exit 1
          fi

      - name: Read version
        id: version
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instlab-cloud-m-${{ steps.version.outputs.ver }}-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # 三种触发方式都要能走到这里：
          #   tag 推送   → 用 tag 本身，且允许覆盖已有 Release 的附件
          #   手动触发   → 用填进去的 tag（补发历史版本时唯一的路，因为 tag 指向的
          #                提交里带的还是旧 workflow 文件）
          #   推送到 main → 按 package.json 的版本号推定 vA.B.C：作者用 GitHub Desktop
          #                点 Push 只推分支、不会带上 tag，所以这里也负责把正式版发出去；
          #                已经发过的版本不再覆盖，测试构建因此不会被误当成正式版。
          case "$GITHUB_REF" in
            refs/tags/*)
              t="${GITHUB_REF#refs/tags/}"; clobber=yes ;;
            *)
              if [ -n "${INPUT_TAG:-}" ]; then
                t="$INPUT_TAG"; clobber=yes
              else
                # 取三位正式版本号：package.json 此刻可能已被注入成 A.B.C-<构建号>
                raw=$(node -p "require('./package.json').version")
                t="v${raw%%-*}"; clobber=no
              fi ;;
          esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "clobber=$clobber" >> "$GITHUB_OUTPUT"
          echo "本次构建对应的发布目标: $t（覆盖已有 Release 附件: $clobber）"

      - name: Check existing release
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
          else
            echo "yes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick release notes
        id: notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "file=changelog/CHANGELOG-${TAG#v}.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          APK: android/app/build/outputs/apk/release/app-release.apk
          CLOBBER: ${{ steps.release.outputs.clobber }}
          EXISTS: ${{ steps.exists.outputs.yes }}
        run: |
          # 判据是「有没有 Release」，不是「有没有 tag」——按 tag 判会恰好反过来：
          # 正式版总是先推 tag 再构建，于是每次都跳过发布，产物只留在 artifact 里。
          if [ "$EXISTS" = "1" ]; then
            if [ "$CLOBBER" = "yes" ]; then
              echo "Release $TAG 已存在，覆盖其安装包附件"
              gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Release $TAG 已发布过，本次是分支构建，不动它"
            fi
            exit 0
          fi
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "APK 自动构建发布。")
            echo "未找到 $NOTES_FILE，改用默认说明"
          fi
          # --verify-tag 要求 tag 已在远端；分支构建推定的版本号若还没打 tag，
          # 就退回不带该参数创建（gh 会顺手把 tag 建在该提交上）。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "INSTLAB CLOUD M $TAG" "${NOTES_ARGS[@]}" "$APK" --repo "$GITHUB_REPOSITORY"
          else
            echo "远端还没有 $TAG，Release 创建时一并补上"
            gh release create "$TAG" \
              --title "INSTLAB CLOUD M $TAG" "${NOTES_ARGS[@]}" "$APK" --repo "$GITHUB_REPOSITORY"
          fi
