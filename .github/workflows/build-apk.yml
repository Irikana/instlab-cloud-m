name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Expo CLI
        run: npx expo --version

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-ndk-27.1.12297006
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Build Release APK (log to file)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify APK exists
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK 存在: $(ls -lh android/app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "::error::APK 未生成，构建失败"
            exit 1
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
          retention-days: 7

      - name: Upload problems report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: android/build/reports/problems/
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instlab-cloud-m-${{ github.ref_name }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Read version
        id: version
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.version.outputs.ver }}" >/dev/null 2>&1; then
            echo "tag ${{ steps.version.outputs.ver }} 已存在，跳过 Release 创建"
          else
            gh release create "${{ steps.version.outputs.ver }}" \
              android/app/build/outputs/apk/release/app-release.apk \
              --title "INSTLAB CLOUD M ${{ steps.version.outputs.ver }}" \
              --notes "APK 自动构建发布。"
          fi
