name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布为 Release 的 tag（如 v0.0.10）；留空则只构建测试包'
        required: false
        default: ''
  push:
    branches: [main, master]
    # 正式发版看 tag：作者用 GitHub Desktop 只推分支不会带上 tag，
    # 补推 vA.B.C 才会走到下面创建 Release 的分支。
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Expo CLI
        run: npx expo --version

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify APK exists
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK 存在: $(ls -lh android/app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "::error::APK 未生成，构建失败"
            exit 1
          fi

      - name: Read version
        id: version
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instlab-cloud-m-${{ steps.version.outputs.ver }}-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) t="${GITHUB_REF#refs/tags/}" ;;
            *) t="${INPUT_TAG:-}" ;;
          esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          if [ -n "$t" ]; then
            echo "本次构建将发布 Release: $t"
          else
            echo "非 tag 构建：只上传 artifact，不创建 Release"
          fi

      - name: Pick release notes
        id: notes
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "file=changelog/CHANGELOG-${TAG#v}.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          APK: android/app/build/outputs/apk/release/app-release.apk
        run: |
          # 判据是「有没有 Release」，不是「有没有 tag」——按 tag 判会恰好反过来：
          # 正式版总是先推 tag 再构建，于是每次都跳过发布，产物只留在 artifact 里。
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "APK 自动构建发布。")
            echo "未找到 $NOTES_FILE，改用默认说明"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖其安装包附件"
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --verify-tag \
              --title "INSTLAB CLOUD M $TAG" \
              "${NOTES_ARGS[@]}" "$APK" \
              --repo "$GITHUB_REPOSITORY"
          fi
